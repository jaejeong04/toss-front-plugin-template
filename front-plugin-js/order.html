<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const HEARTBEAT_MS = 20000;

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      async function main() {
        const sessionId = location.hash.slice(1);

        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch || dispatch.sessionId !== sessionId) {
          location.href = "./home.html";
          return;
        }

        const { serialNumber } = await sdk.app.getSerialNumber();

        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        function sendAbortAndGoHome() {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "session.abort",
                payload: { sessionId, reason: "USER_BACKED_OUT" },
              }),
            );
          }
          closeWs(ws);
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          location.href = "./home.html";
        }

        ws.onopen = () => {
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          ws.send(
            JSON.stringify({
              type: "session.claim",
              payload: { sessionId },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);
        };

        ws.onclose = () => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] order.html ws error", ev);
        };

        ws.onmessage = async (ev) => {
          try {
            const msg = JSON.parse(ev.data);

            switch (msg.type) {
              case "pong":
                return;

              case "session.abort": {
                // CRM-driven abort (ABORTED_BY_CRM) — valid race window while
                // plugin is on the medicash UI. Per frontend MD §4.2 + §7.2:
                // navigate to home.html via location.href (NOT sdk.app.setIdle()).
                ws.onmessage = null;
                if (heartbeatTimer != null) {
                  clearInterval(heartbeatTimer);
                  heartbeatTimer = null;
                }
                console.log(
                  "[smartdoctor] order.html session.abort",
                  msg.payload,
                );
                await sdk.template.openToast({
                  message: "결제가 취소되었습니다.",
                  icon: "error",
                });
                closeWs(ws);
                location.href = "./home.html";
                return;
              }

              case "error": {
                // Per frontend MD §7.6 + design doc §6: surface toast, navigate
                // to home.html via location.href, do NOT retry.
                ws.onmessage = null;
                if (heartbeatTimer != null) {
                  clearInterval(heartbeatTimer);
                  heartbeatTimer = null;
                }
                const p = msg.payload || {};
                console.warn(
                  "[smartdoctor] order.html backend error",
                  p.code,
                  p.message,
                  p.sessionId,
                );
                const reason = p.message || p.code || "알 수 없는 오류";
                await sdk.template.openToast({
                  message: `오류가 발생했어요: ${reason}`,
                  icon: "error",
                });
                closeWs(ws);
                location.href = "./home.html";
                return;
              }

              default:
                console.warn(
                  "[smartdoctor] order.html unknown ws message",
                  msg.type,
                  msg,
                );
                return;
            }
          } catch (e) {
            console.warn(
              "[smartdoctor] order.html ws message handler failed",
              e,
            );
          }
        };

        function computeUsableCash(dispatch) {
          const treatmentTotal =
            dispatch.amount.supplyValue + dispatch.amount.tax;
          const balance = dispatch.pointContext?.availableBalance ?? 0;
          const rawUsable = Math.min(balance, treatmentTotal);
          return Math.floor(rawUsable / 100) * 100;
        }

        const usableCash = computeUsableCash(dispatch);
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        // Tip is excluded from `treatmentTotal` because medicash can't cover
        // it (backend validation: pointUseAmount + charged{Supply,Tax} == supply
        // + tax). Customer-facing total displays must still include it though,
        // so it lives as a separate variable.
        const tip = dispatch.amount.tip ?? 0;
        const minUse = dispatch.pointContext?.minUseAmount ?? 0;

        function handlePointChoice(pointUse) {
          const charged = treatmentTotal - pointUse;
          const tax = Math.floor(charged / 11);
          const supplyValue = charged - tax;

          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "session.chargeContext",
                payload: {
                  sessionId,
                  pointUseAmount: pointUse,
                  chargedSupplyValue: supplyValue,
                  chargedTax: tax,
                },
              }),
            );
          }

          sessionStorage.setItem(
            "smartdoctor.dispatch.pointUse",
            String(pointUse),
          );

          // 100%-메디캐시: skip NICE entirely; payment.html sends session.result
          // with tossResponse: null directly (existing skip path).
          if (charged === 0) {
            closeWs(ws);
            location.href = "./payment.html#" + sessionId;
            return;
          }

          // Reader mode: plugin acts as a passive serial bridge between NICE
          // 카드단말기 and Toss's internal VAN module. Per Toss Slack guidance
          // (channel C0ANAJW463E msg 1778737088, 2026-05-14):
          // - Toss FRONT auto-overlays 통합결제창 when NICE triggers
          // - Plugin does NOT call sdk.payment.requestPayment
          // - Plugin does NOT send session.result (CRM forwards from NICE)
          enterReaderMode();
        }

        function enterReaderMode() {
          // Show Toss's idle page — Toss SDK auto-overlays the 통합결제창 on top
          // when NICE 카드단말기 triggers via serial. Plugin doesn't need a
          // custom waiting screen (per Toss Slack guidance 2026-05-14).
          sdk.template.renderIdlePage({ type: "default" });

          // Open serial port for NICE communication. Plugin is a passive bridge:
          // serial input from NICE → sdk.van.write to Toss's internal VAN module.
          // baudRate 115200 per Toss spec.
          let unlisten = null;
          try {
            sdk.serial.open({ baudRate: 115200, intercept: true });
            unlisten = sdk.serial.listen((params) => {
              try {
                sdk.van.write(params);
              } catch (e) {
                console.warn("[smartdoctor] order.html sdk.van.write failed", e);
              }
            });
          } catch (e) {
            console.warn("[smartdoctor] order.html sdk.serial.open failed", e);
          }

          // Clean up serial port on unload (next page load, navigation, etc.).
          // Guard with `unlisten !== null` — if sdk.serial.open() threw above,
          // the port was never opened and close() would be a no-op-or-error.
          window.addEventListener("beforeunload", () => {
            if (unlisten === null) return;
            try {
              sdk.serial.close();
              unlisten();
            } catch (e) {
              console.warn("[smartdoctor] order.html sdk.serial.close failed", e);
            }
          });
        }

        function renderMedicashPage() {
          document.getElementById("app").innerHTML = `
            <div class="medicash-page">
              <div class="medicash-header">
                <button class="medicash-back" id="medicashBack">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18l-6-6 6-6" stroke="#191F28" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="medicash-body">
                <h1 class="medicash-title">메디캐시를 쓸까요?</h1>
                <div class="medicash-balance">
                  <div class="medicash-icon">P</div>
                  <div class="medicash-balance-info">
                    <span class="medicash-balance-label">사용 가능한 메디캐시</span>
                    <span class="medicash-balance-amount">${usableCash.toLocaleString()}캐시</span>
                  </div>
                </div>
              </div>
              <div class="medicash-summary">
                <div class="medicash-summary-row">
                  <span class="medicash-summary-label">메디캐시 사용</span>
                  <span class="medicash-summary-value">${usableCash.toLocaleString()}캐시</span>
                </div>
                <div class="medicash-summary-row">
                  <span class="medicash-summary-label">총 결제 금액</span>
                  <span class="medicash-summary-total">${(treatmentTotal + tip - usableCash).toLocaleString()}원</span>
                </div>
              </div>
              <div class="medicash-actions">
                <button class="medicash-btn medicash-btn-cancel" id="medicashSkip">사용 안 함</button>
                <button class="medicash-btn medicash-btn-submit" id="medicashUse">전액 사용</button>
              </div>
            </div>
          `;

          document.getElementById("medicashBack").addEventListener(
            "click",
            sendAbortAndGoHome,
          );
          document.getElementById("medicashSkip").addEventListener(
            "click",
            () => handlePointChoice(0),
          );
          document.getElementById("medicashUse").addEventListener(
            "click",
            () => handlePointChoice(usableCash),
          );
        }

        if (usableCash >= minUse && usableCash > 0) {
          renderMedicashPage();
        } else {
          handlePointChoice(0);
        }
      }

      main().catch((err) => {
        console.error("[smartdoctor] order.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
