<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const HEARTBEAT_MS = 20000;

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      async function main() {
        const sessionId = location.hash.slice(1);

        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch || dispatch.sessionId !== sessionId) {
          location.href = "./home.html";
          return;
        }

        const { serialNumber } = await sdk.app.getSerialNumber();

        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        // Connect watchdog: claim + 메디캐시 UI run inside ws.onopen, so if WS B
        // never connects onopen never fires and the kiosk would sit blank. Bail
        // to home.html after 10s if still not open (cleared in ws.onopen).
        // Nothing has been claimed/sent yet, so bailing is safe.
        const connectWatchdog = setTimeout(() => {
          if (ws.readyState !== WebSocket.OPEN) {
            console.warn("[smartdoctor] order.html WS B connect timeout");
            try {
              ws.close();
            } catch (e) {}
            location.href = "./home.html";
          }
        }, 10000);

        function sendAbortAndGoHome() {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "session.abort",
                payload: { sessionId, reason: "USER_BACKED_OUT" },
              }),
            );
          }
          closeWs(ws);
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          location.href = "./home.html";
        }

        ws.onopen = () => {
          clearTimeout(connectWatchdog);
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          ws.send(
            JSON.stringify({
              type: "session.claim",
              payload: { sessionId },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);

          // Medicash-UI-vs-skip decision lives here (inside ws.onopen),
          // not at the end of main(). Reason: `new WebSocket(...)` is
          // CONNECTING (not OPEN) when synchronous main() finishes, so a
          // top-level handlePointChoice(0) — the no-medicash skip path —
          // would hit the `ws.readyState === OPEN` guard inside it and
          // silently drop `session.chargeContext`. BE needs that message to
          // record the post-메디캐시 amounts and drive the 메디캐시 deduction;
          // without it the session sits IN_PROGRESS until backend expiry.
          // (In client mode payment.html — not NICE — runs the card payment.)
          // Running this inside onopen guarantees readyState is
          // OPEN, so the send goes through. The medicash-UI branch is
          // race-free either way because the user click happens long
          // after onopen, but co-locating both branches keeps the entry
          // point in one place. All identifiers below (usableCash, minUse,
          // handlePointChoice, renderMedicashPage) are declared later in
          // main() but resolve at call time — onopen is async.
          if (usableCash >= minUse && usableCash > 0) {
            renderMedicashPage();
          } else {
            handlePointChoice(0);
          }
        };

        ws.onclose = () => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] order.html ws error", ev);
        };

        ws.onmessage = async (ev) => {
          try {
            const msg = JSON.parse(ev.data);

            switch (msg.type) {
              case "pong":
                return;

              case "session.abort": {
                // CRM-driven abort (ABORTED_BY_CRM) — valid race window while
                // plugin is on the medicash UI. Per frontend MD §4.2 + §7.2:
                // navigate to home.html via location.href (NOT sdk.app.setIdle()).
                ws.onmessage = null;
                if (heartbeatTimer != null) {
                  clearInterval(heartbeatTimer);
                  heartbeatTimer = null;
                }
                console.log(
                  "[smartdoctor] order.html session.abort",
                  msg.payload,
                );
                await sdk.template.openToast({
                  message: "결제가 취소되었습니다.",
                  icon: "error",
                });
                closeWs(ws);
                location.href = "./home.html";
                return;
              }

              case "error": {
                // Per frontend MD §7.6 + design doc §6: surface toast, navigate
                // to home.html via location.href, do NOT retry.
                ws.onmessage = null;
                if (heartbeatTimer != null) {
                  clearInterval(heartbeatTimer);
                  heartbeatTimer = null;
                }
                const p = msg.payload || {};
                console.warn(
                  "[smartdoctor] order.html backend error",
                  p.code,
                  p.message,
                  p.sessionId,
                );
                const reason = p.message || p.code || "알 수 없는 오류";
                await sdk.template.openToast({
                  message: `오류가 발생했어요: ${reason}`,
                  icon: "error",
                });
                closeWs(ws);
                location.href = "./home.html";
                return;
              }

              default:
                console.warn(
                  "[smartdoctor] order.html unknown ws message",
                  msg.type,
                  msg,
                );
                return;
            }
          } catch (e) {
            console.warn(
              "[smartdoctor] order.html ws message handler failed",
              e,
            );
          }
        };

        function computeUsableCash(dispatch) {
          const treatmentTotal =
            dispatch.amount.supplyValue + dispatch.amount.tax;
          const balance = dispatch.pointContext?.availableBalance ?? 0;
          const rawUsable = Math.min(balance, treatmentTotal);
          return Math.floor(rawUsable / 100) * 100;
        }

        const usableCash = computeUsableCash(dispatch);
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        // Tip is excluded from `treatmentTotal` because medicash can't cover
        // it (backend validation: pointUseAmount + charged{Supply,Tax} == supply
        // + tax). Customer-facing total displays must still include it though,
        // so it lives as a separate variable.
        const tip = dispatch.amount.tip ?? 0;
        const minUse = dispatch.pointContext?.minUseAmount ?? 0;

        function handlePointChoice(pointUse) {
          const charged = treatmentTotal - pointUse;
          const tax = Math.floor(charged / 11);
          const supplyValue = charged - tax;

          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "session.chargeContext",
                payload: {
                  sessionId,
                  pointUseAmount: pointUse,
                  chargedSupplyValue: supplyValue,
                  chargedTax: tax,
                },
              }),
            );
          }

          sessionStorage.setItem(
            "smartdoctor.dispatch.pointUse",
            String(pointUse),
          );

          // Client mode: BOTH the card path (charged > 0) and the 100%-메디캐시
          // path (charged === 0) hand off to payment.html, which branches on
          // `charged` — it calls sdk.payment.requestPayment for the card, or
          // sends session.result(tossResponse: null) for 100% 메디캐시.
          // (Was reader-mode enterReaderMode() before the client-mode switch.)
          // See docs/toss-client-mode-flow.md §6.1 / §8.
          // Navigation tears down this socket; no explicit closeWs — calling
          // close() here can race the buffered session.chargeContext flush, and
          // payment.html's session.result re-carries the amounts as a backstop.
          location.href = "./payment.html#" + sessionId;
        }

        function renderMedicashPage() {
          sdk.template.renderUsePointPage({
            points: [{ name: "사용 가능한 메디캐시", amount: usableCash }],
            summary: {
              pointUsedAmount: usableCash,
              paymentAmount: treatmentTotal + tip - usableCash,
            },
            cta: {
              submit: { onClick: () => handlePointChoice(usableCash) }, // 전액 사용
              cancel: { onClick: () => handlePointChoice(0) }, // 사용 안 함
            },
            onBack: sendAbortAndGoHome,
          });
        }
      }

      main().catch((err) => {
        console.error("[smartdoctor] order.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
