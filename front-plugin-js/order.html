<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // order.html — payment-path use-point + order-confirm. Spec §6.2.
      // Reads the dispatch payload stashed by home.html on session.dispatch
      // (spec §4.2/§6.1), opens a fresh WS B for session.claim/session.abort
      // (spec §4.3), and renders renderUsePointPage / renderOrderPage. The
      // actual requestPayment call lives in payment.html (Task 6) — order.html
      // hands the chosen pointUse off via sessionStorage and navigates.

      // Spec §4.1: client sends ping every 20s; backend drops after 3 misses.
      // The user can pause on the use-point page indefinitely, so we ping to
      // keep the socket alive while they decide.
      const HEARTBEAT_MS = 20000;

      async function main() {
        // 1. sessionId from URL hash. home.html sets `./order.html#<sessionId>`.
        const sessionId = location.hash.slice(1);

        // 2. Dispatch payload stashed by home.html. Validate kind + sessionId
        //    match — anything else is a stale or wrong-page invocation.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (
          !dispatch ||
          dispatch.kind !== "payment" ||
          dispatch.sessionId !== sessionId
        ) {
          sdk.app.setIdle();
          return;
        }

        // 3. Device serial — backend trusts it via partner-portal registration.
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open a fresh WS B connection. order.html is not the dispatcher —
        //    we only need it to send session.claim and (optionally) session.abort.
        //    payment.html will open its own socket, and home.html re-opens the
        //    long-lived one when we go idle.
        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        ws.onopen = () => {
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          // Spec §4.3: plugin acknowledges it's about to show the order page.
          ws.send(
            JSON.stringify({
              type: "session.claim",
              payload: { sessionId },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);
        };

        ws.onclose = () => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] order.html ws error", ev);
        };

        // 5. Compute usable cash. Spec §4.4 / PDF p.9:
        //      usableCash = floor(min(balance, treatmentTotal) / 100) * 100
        //    Math.floor (NOT round) — round-down ensures we never offer more
        //    cash than the customer holds after the floor-to-100 step.
        function computeUsableCash(dispatch) {
          const treatmentTotal =
            dispatch.amount.supplyValue + dispatch.amount.tax;
          const balance = dispatch.pointContext?.availableBalance ?? 0;
          const rawUsable = Math.min(balance, treatmentTotal);
          return Math.floor(rawUsable / 100) * 100;
        }

        // 6. Build the renderOrderPage snapshot for a given pointUse. Spec §6.2 +
        //    spec §2.3 renderOrderPage shape. Backend already populates items /
        //    discounts / summary on dispatch.orderSnapshot; we only adjust for
        //    the chosen point use and always set paidAmount + earned.
        //    - pointUse > 0: append "메디캐시 사용" to discounts and bump
        //      summary.discountAmount.
        //    - Always: set summary.paidAmount = totalAmount − discountAmount.
        //    - Always: set summary.earned from dispatch.pointContext (the
        //      discriminated-union value:number form requires `suffix`).
        function buildOrderSnapshotWithPoints(snapshot, pointUse, pointContext) {
          const baseDiscounts = snapshot.discounts ?? [];
          const baseSummary = snapshot.summary ?? {};
          const baseDiscountAmount = baseSummary.discountAmount ?? 0;

          const discounts =
            pointUse > 0
              ? [...baseDiscounts, { label: "메디캐시 사용", value: pointUse }]
              : baseDiscounts;

          const discountAmount =
            pointUse > 0 ? baseDiscountAmount + pointUse : baseDiscountAmount;

          // Defensive: pointContext may exist with availableBalance/minUseAmount
          // but lack earn-program fields (e.g. hospital with 메디캐시 use enabled
          // but no earn program). Build the discriminated-union earned shape only
          // when ALL three fields are present — otherwise undefined values would
          // violate Toss's "value: number requires suffix: string" contract.
          const hasEarn =
            pointContext &&
            pointContext.earnLabel != null &&
            pointContext.earnAmount != null &&
            pointContext.earnSuffix != null;
          const earned = hasEarn
            ? {
                label: pointContext.earnLabel,
                value: pointContext.earnAmount,
                suffix: pointContext.earnSuffix,
              }
            : baseSummary.earned;

          const summary = {
            ...baseSummary,
            discountAmount,
            paidAmount: baseSummary.totalAmount - discountAmount,
            ...(earned !== undefined ? { earned } : {}),
          };

          return {
            ...snapshot,
            discounts,
            summary,
          };
        }

        // 7. Hand off to payment.html with the chosen pointUse stashed in a
        //    separate sessionStorage key (`smartdoctor.dispatch.pointUse`) so
        //    payment.html can read both the dispatch payload and the user's
        //    point choice. Close our WS first — payment.html opens its own.
        function showOrderPage(pointUse) {
          const orderForDisplay = buildOrderSnapshotWithPoints(
            dispatch.orderSnapshot,
            pointUse,
            dispatch.pointContext,
          );

          sdk.template.renderOrderPage({
            order: orderForDisplay,
            localeCode: "ko",
            onClick: () => {
              sessionStorage.setItem(
                "smartdoctor.dispatch.pointUse",
                String(pointUse),
              );
              if (ws.readyState === WebSocket.OPEN) {
                ws.close();
              }
              location.href = "./payment.html#" + sessionId;
            },
            // Spec §2.3: renderOrderPage's onBack is [GAP] — not in the
            // documented Params block. Wire it but spec §6.2 explicitly says
            // "abort correctness must not depend solely on this callback firing."
            // The CRM-side abort path covers the case where this never fires.
            onBack: () => {
              if (ws.readyState === WebSocket.OPEN) {
                ws.send(
                  JSON.stringify({
                    type: "session.abort",
                    payload: { sessionId, reason: "USER_BACKED_OUT" },
                  }),
                );
                ws.close();
              }
              // Hygiene: clear the dispatch payload + point choice so a stale
              // entry can't leak into the next session. home.html overwrites
              // on the next dispatch anyway, but cleaning up here is cheap.
              sessionStorage.removeItem("smartdoctor.dispatch");
              sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
              sdk.app.setIdle();
            },
          });
        }

        // 8. Decide between use-point page and direct order page. Spec §4.4:
        //    "If 사용 가능 캐시 < minUseAmount, skip renderUsePointPage entirely."
        const usableCash = computeUsableCash(dispatch);
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        const minUse = dispatch.pointContext?.minUseAmount ?? 0;

        if (usableCash >= minUse && usableCash > 0) {
          sdk.template.renderUsePointPage({
            points: [{ name: "사용 가능한 메디캐시", amount: usableCash }],
            summary: {
              pointUsedAmount: usableCash,
              paymentAmount: treatmentTotal - usableCash,
            },
            cta: {
              // Per PDF: binary choice, not a slider.
              submit: { onClick: () => showOrderPage(usableCash) }, // 전액 사용
              cancel: { onClick: () => showOrderPage(0) }, // 사용 안 함
            },
            // Same pattern as renderOrderPage's onBack above: session is
            // mid-flight (IN_PROGRESS), so abort the session before going
            // idle. Without this, the back-arrow leaves a blank WebView
            // that requires a device reboot to clear.
            onBack: () => {
              if (ws.readyState === WebSocket.OPEN) {
                ws.send(
                  JSON.stringify({
                    type: "session.abort",
                    payload: { sessionId, reason: "USER_BACKED_OUT" },
                  }),
                );
                ws.close();
              }
              sessionStorage.removeItem("smartdoctor.dispatch");
              sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
              sdk.app.setIdle();
            },
          });
        } else {
          showOrderPage(0);
        }
      }

      main().catch((err) => {
        console.error("[smartdoctor] order.html fatal", err);
        sdk.app.setIdle();
      });
    </script>
  </body>
</html>
