<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // payment.html — terminal page for two flows dispatched by home.html
      // (spec §6.2 doPayment, §4.2/§4.3 cancel/refund). Reads the dispatch
      // payload stashed in sessionStorage, opens its own WS B, then either
      // calls sdk.payment.requestPayment (payment) or
      // sdk.payment.requestPaymentCancel (refund) and reports the result.
      //
      // No pending-payment recovery on this page — recovery runs on home.html
      // (spec §5). Skipping it here avoids a race where a stale recovery
      // overwrites the new pending-payment storage we're about to write.

      // Helper: spec §6.2 mapTossFailureToKorean.
      function mapTossFailureToKorean(result) {
        if (result.type === "TIMEOUT") return "시간 초과";
        if (result.type === "CANCELED") return "승인 거절";
        // TODO(verify-error-shape): Toss failure-code → Korean mapping is
        // GAP per spec §6.2 — extend after real-device verification.
        return "통신 오류";
      }

      // Helper: spec §6.2 mapPaymentMethodToKorean.
      function mapPaymentMethodToKorean(result) {
        const m = result.response && result.response.paymentMethod;
        if (m === "CARD") return "카드";
        if (m === "BARCODE") return "QR/바코드";
        if (m === "CASH") return "현금";
        return "—";
      }

      // Send a JSON message over WS B, gated by readyState. Spec §4.3.
      function sendWs(ws, message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(message));
        }
      }

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      // ── PAYMENT FLOW ────────────────────────────────────────────────
      // Spec §6.2. dispatch.kind === "payment".
      async function runPayment(ws, dispatch) {
        // 1. pointUse from order.html. Falsy/NaN → 0.
        const pointUse =
          Number(sessionStorage.getItem("smartdoctor.dispatch.pointUse")) || 0;

        // 2. Charged amounts. Spec §6.2: tax = floor(charged / 11),
        //    supplyValue = charged − tax. NOT charged * 0.1, NOT round.
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        const charged = treatmentTotal - pointUse;
        const tax = Math.floor(charged / 11);
        const supplyValue = charged - tax;

        // 3. session.chargeContext BEFORE requestPayment so backend can
        //    recover even if the plugin reloads mid-Toss-UI. Spec §4.3.
        sendWs(ws, {
          type: "session.chargeContext",
          payload: {
            sessionId: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
          },
        });

        // 4. Persist pendingPayment BEFORE requestPayment. paymentKey ===
        //    sessionId per spec §4.2. Used by home.html's recovery helper
        //    if this page crashes.
        await sdk.storage.set({
          key: window.smartdoctor.PENDING_KEY,
          value: JSON.stringify({
            sessionId: dispatch.sessionId,
            paymentKey: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
          }),
        });

        // 5. Request payment. Spec §2.1 / §7: cash excluded literally.
        //    The SDK returns {type: "SUCCESS"|"CANCELED"|"TIMEOUT"} — failure
        //    is a value, not a throw, so no try/catch needed for branching.
        const result = await sdk.payment.requestPayment({
          paymentKey: dispatch.sessionId,
          tax,
          supplyValue,
          tip: dispatch.amount.tip,
          timeoutMs: dispatch.timeoutMs ?? 60000,
          localeCode: "ko",
          excludePaymentTypes: ["CASH"],
        });

        // 6. Remove pendingPayment AFTER requestPayment resolves — we now
        //    have the live result and can post it directly.
        await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });

        // 7. session.result on the live path (no `late: true`). Spec §4.3.
        sendWs(ws, {
          type: "session.result",
          payload: {
            sessionId: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
            tossResponse: result,
          },
        });

        // 8. sessionStorage hygiene — dispatch + pointUse have been consumed.
        sessionStorage.removeItem("smartdoctor.dispatch");
        sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

        // 9. Render terminal screen.
        if (result.type === "SUCCESS") {
          // Spec §6.2 / PDF p.13: renderResultPage with image+success.
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "수납 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => sdk.app.setIdle(),
            buttons: [
              {
                label: "확인",
                onClick: () => sdk.app.setIdle(),
                closeOnClick: true,
              },
            ],
            localeCode: "ko",
          });
        } else {
          // Spec §6.2 / PDF p.12: renderOrderResultPage cancelled.
          // Retry button re-enters runPayment with the same dispatch +
          // (closure) pointUse — re-enters spec §6.2 p.11.
          closeWs(ws);
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              items: dispatch.orderSnapshot.items,
              summary: {
                totalAmount: treatmentTotal,
                items: [
                  {
                    label: "진료 금액",
                    value: `${treatmentTotal.toLocaleString()}원`,
                    theme: "blue",
                  },
                  ...(pointUse > 0
                    ? [
                        {
                          label: "메디캐시 사용",
                          value: `-${pointUse.toLocaleString()}원`,
                          theme: "blue",
                        },
                      ]
                    : []),
                  {
                    label: "취소 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "결제 취소",
                    value: `${charged.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "다시 결제하기",
              // Re-enter the live path. The original dispatch + the
              // sessionStorage-stashed pointUse — wait, we removed it in
              // step 8. Re-stash before retry so step 1 reads it again.
              onClick: () => {
                sessionStorage.setItem(
                  "smartdoctor.dispatch",
                  JSON.stringify(dispatch),
                );
                sessionStorage.setItem(
                  "smartdoctor.dispatch.pointUse",
                  String(pointUse),
                );
                // Open a fresh WS for the retry — the prior one is closed.
                runFreshFlow().catch((err) => {
                  console.error(
                    "[smartdoctor] payment.html retry fatal",
                    err,
                  );
                  sdk.app.setIdle();
                });
              },
            },
          });
        }
      }

      // ── CANCEL / REFUND FLOW ────────────────────────────────────────
      // Spec §4.3 refund.result. dispatch.kind === "cancel".
      async function runCancel(ws, dispatch) {
        // 1. Pass cancelParams through as-is — backend constructed it.
        const result = await sdk.payment.requestPaymentCancel(
          dispatch.cancelParams,
        );

        // 2. refund.result over WS. Spec §4.3.
        sendWs(ws, {
          type: "refund.result",
          payload: {
            refundId: dispatch.refundId,
            tossResponse: result,
          },
        });

        // 3. Hygiene: clear dispatch (no pointUse on the cancel branch, but
        //    defensively remove a stale leftover from a prior crashed session).
        sessionStorage.removeItem("smartdoctor.dispatch");
        sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

        // 4. Render result.
        if (result.type === "SUCCESS") {
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "환불 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => sdk.app.setIdle(),
            buttons: [
              {
                label: "확인",
                onClick: () => sdk.app.setIdle(),
                closeOnClick: true,
              },
            ],
            localeCode: "ko",
          });
        } else {
          // Failure path: cancel-specific labels, no retry CTA — refund
          // retry is backend-driven per spec.
          const refundAmount =
            (dispatch.cancelParams?.supplyValue ?? 0) +
            (dispatch.cancelParams?.tax ?? 0);
          closeWs(ws);
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              // No order snapshot on the refund branch; show an empty list.
              items: [],
              summary: {
                totalAmount: refundAmount,
                items: [
                  {
                    label: "환불 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "환불 금액",
                    value: `${refundAmount.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "확인",
              onClick: () => sdk.app.setIdle(),
            },
          });
        }
      }

      // ── BOOT ────────────────────────────────────────────────────────
      // Reads hash + dispatch payload, opens WS, dispatches to runPayment
      // or runCancel. The `runFreshFlow` indirection lets the failure-path
      // retry button re-run boot for a fresh WS.
      async function runFreshFlow() {
        // 1. Hash id.
        const hashId = location.hash.slice(1);

        // 2. Dispatch payload — stashed by home.html on session.dispatch.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch) {
          sdk.app.setIdle();
          return;
        }

        // 3. Token defensive read.
        const { value: token } = await sdk.storage.get({
          key: "smartdoctor.token",
        });
        if (token == null) {
          location.href = "./onboarding.html";
          return;
        }
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open WS B. Wait for onopen before dispatching.
        const ws = new WebSocket(
          window.smartdoctor.backendWsUrl(
            "/plugin?token=" + encodeURIComponent(token),
          ),
        );

        // 5. Minimal inbound handler — payment.html is mid-flow, not the
        //    dispatcher. session.abort defense-in-depth per spec §8.
        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("[smartdoctor] payment.html ws parse failed", e);
            return;
          }
          switch (msg.type) {
            case "session.abort":
              // Per spec §8 backend should NOT send this once we're in
              // IN_PROGRESS — log and continue.
              console.warn(
                "[smartdoctor] payment.html unexpected session.abort",
                msg.payload,
              );
              return;
            case "error":
              console.warn("[smartdoctor] payment.html backend error", msg.payload);
              return;
            default:
              console.log("[smartdoctor] payment.html ws message", msg.type);
              return;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] payment.html ws error", ev);
        };

        ws.onclose = (ev) => {
          console.log(
            "[smartdoctor] payment.html ws closed",
            "code=" + ev.code,
            "reason=" + ev.reason,
          );
        };

        ws.onopen = async () => {
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          // 6. Dispatch by kind + hash match.
          if (dispatch.kind === "payment" && dispatch.sessionId === hashId) {
            await runPayment(ws, dispatch);
          } else if (
            dispatch.kind === "cancel" &&
            dispatch.refundId === hashId
          ) {
            await runCancel(ws, dispatch);
          } else {
            closeWs(ws);
            sdk.app.setIdle();
          }
        };
      }

      runFreshFlow().catch((err) => {
        console.error("[smartdoctor] payment.html fatal", err);
        sdk.app.setIdle();
      });
    </script>
  </body>
</html>
