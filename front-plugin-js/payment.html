<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // payment.html — terminal page for two flows dispatched by home.html
      // (spec §6.2 doPayment, §4.2/§4.3 cancel/refund). Reads the dispatch
      // payload stashed in sessionStorage, opens its own WS B, then either
      // calls sdk.payment.requestPayment (payment) or
      // sdk.payment.requestPaymentCancel (refund) and reports the result.
      //
      // No pending-payment recovery on this page — recovery runs on home.html
      // (spec §5). Skipping it here avoids a race where a stale recovery
      // overwrites the new pending-payment storage we're about to write.

      // Spec §4.1: client sends ping every 20s; backend drops after 3 misses.
      // The user can sit on the Toss native payment UI for up to timeoutMs
      // (default 60s), so we ping to keep the socket alive during that window.
      const HEARTBEAT_MS = 20000;

      // 할부 floor: Korean issuers decline installments under 50,000원, so the
      // 할부 selection screen only shows at/above this amount (business
      // decision 2026-07-13). Below it, payment proceeds as 일시불.
      const INSTALLMENT_MIN_AMOUNT = 50000;

      // Helper: spec §6.2 mapTossFailureToKorean — maps a Toss non-success
      // result (or a synthesized FAILED envelope) to the 기획 취소 사유 labels:
      // 승인 거절 / 잔액 부족 / 한도 초과 / 통신 오류 / 시간 초과.
      function mapTossFailureToKorean(result) {
        if (!result) return "통신 오류";
        // Reason-string mapping. [MUST TEST]: real Toss reason codes are
        // undocumented — verify the actual strings on-device and adjust.
        const reason = (result.response && result.response.reason) || "";
        if (/INSUFFICIENT|BALANCE|잔액/i.test(reason)) return "잔액 부족";
        if (/LIMIT|EXCEED|한도/i.test(reason)) return "한도 초과";
        if (/DECLIN|REJECT|승인/i.test(reason)) return "승인 거절";
        if (/TIMEOUT|시간/i.test(reason)) return "시간 초과";
        if (result.type === "TIMEOUT") return "시간 초과";
        if (result.type === "CANCELED") return "승인 거절";
        if (result.type === "FAILED") return "승인 거절";
        return "통신 오류";
      }

      // Helper: spec §6.2 mapPaymentMethodToKorean. Null-safe: the reject path
      // has no result object, so return "—" rather than throwing.
      function mapPaymentMethodToKorean(result) {
        const m = result && result.response && result.response.paymentMethod;
        if (m === "CARD") return "카드";
        if (m === "BARCODE") return "QR/바코드";
        if (m === "CASH") return "현금";
        return "—";
      }

      // Send a JSON message over WS B, gated by readyState. Spec §4.3.
      // Returns true only when the frame actually went out on an OPEN socket.
      // Callers use this to decide whether it's safe to drop recovery state.
      function sendWs(ws, message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(message));
          return true;
        }
        return false;
      }

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      // N-1: Guard condition helper — avoids repeating the compound check
      // at every guard site. ref.current is set by the WS onmessage handler.
      // A missing sessionId on the payload means "global error, always matches".
      function isBackendErrorForSession(ref, sessionId) {
        return ref.current && (ref.current.sessionId === sessionId || !ref.current.sessionId);
      }

      // Renders a terminal error page using a backend error payload.
      // Both timer and button route to home.html. No custom HTML — uses
      // sdk.template.renderResultPage exclusively. Per spec §11.
      async function renderBackendErrorPage(payload) {
        const reason = (payload && (payload.message || payload.code)) || "알 수 없는 오류";
        const description = `${reason}\n잠시 후 다시 시도해 주세요`;
        await sdk.template.renderResultPage({
          type: "image",
          status: "error",
          title: "결제를 진행할 수 없어요",
          description,
          timerMs: 5000,
          onTimeout: () => { location.href = "./home.html"; },
          buttons: [
            {
              label: "확인",
              onClick: () => { location.href = "./home.html"; },
              closeOnClick: true,
            },
          ],
          // N-2: match every other terminal renderResultPage call in this
          // file — localeCode and onBack prevent a blank WebView on back-tap.
          onBack: () => { location.href = "./home.html"; },
          localeCode: "ko",
        });
      }

      // ── PAYMENT FLOW ────────────────────────────────────────────────
      // Spec §6.2. dispatch.kind === "payment".
      async function runPayment(ws, dispatch, backendErrorRef) {
        // 1. pointUse from order.html. Falsy/NaN → 0.
        const pointUse =
          Number(sessionStorage.getItem("smartdoctor.dispatch.pointUse")) || 0;

        // 2. Charged amounts. Spec §6.2: tax = floor(charged / 11),
        //    supplyValue = charged − tax. NOT charged * 0.1, NOT round.
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        // Clamp: order.html caps usableCash at treatmentTotal, but guard so a
        // bad payload can't feed negative tax/supplyValue into requestPayment.
        let charged = treatmentTotal - pointUse;
        if (charged < 0) charged = 0;
        const tax = Math.floor(charged / 11);
        const supplyValue = charged - tax;

        // 3. 100% 메디캐시 coverage — no Toss-side payment to make.
        //     Toss docs only document non-zero requestPayment examples and don't
        //     specify behavior at tax=0/supplyValue=0, so we skip the SDK call
        //     entirely. Backend contract: when chargedSupplyValue === 0 AND
        //     chargedTax === 0 AND tossResponse === null, treat as a points-only
        //     payment (no card/cash transaction occurred).
        // Skip the SDK call only when there is truly nothing to charge — both
        // the discounted amount AND tip are zero. (tip is always 0 in this
        // system; the guard keeps the card path authoritative if that changes.)
        if (charged === 0 && (dispatch.amount.tip ?? 0) === 0) {
          // Guard: if backend sent an error frame (e.g. rejecting the
          // session after order.html's chargeContext), bail before sending
          // session.result to a discarded session.
          if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
            closeWs(ws);
            await renderBackendErrorPage(backendErrorRef.current);
            return;
          }
          sendWs(ws, {
            type: "session.result",
            payload: {
              sessionId: dispatch.sessionId,
              pointUseAmount: pointUse,
              chargedSupplyValue: 0,
              chargedTax: 0,
              tossResponse: null,
            },
          });
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "수납 완료",
            description: `${hospitalName}에\n방문해주셔서 감사합니다\n메디캐시 ${Number(pointUse).toLocaleString()}캐시 사용`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the success
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
          return;
        }

        // 4. Persist pendingPayment BEFORE requestPayment. paymentKey ===
        //    sessionId per spec §4.2. Used by home.html's recovery helper
        //    if this page crashes.
        await sdk.storage.set({
          key: window.smartdoctor.PENDING_KEY,
          value: JSON.stringify({
            sessionId: dispatch.sessionId,
            paymentKey: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
          }),
        });

        // Bail if backend rejected the session — error frame may have arrived
        // during the WS handoff from order.html or at any point before this.
        // Without this guard the real card would be charged on a session backend
        // has already discarded. Real-money critical.
        if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
          // IM-1: close ws before rendering error page so heartbeat timer
          // stops pinging a backend that already errored. Clear the pending
          // record too — we bail BEFORE requestPayment, so no card was charged.
          await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        // 5. Same-session retry loop. Each attempt() is ONE requestPayment on
        //    the SAME sessionId (paymentKey === sessionId). On any non-success
        //    we send NOTHING terminal (session stays IN_PROGRESS) and render the
        //    itemized failure screen with a 다시 결제하기 retry cta; the terminal
        //    session.result (SUCCESS or FAILED) is sent only on success or the
        //    back-arrow give-up. Spec §6.5 (FAILED envelope); 기획 결제 실패 화면.

        // Build the §6.5 FAILED envelope — reject path ONLY. A resolved
        // CANCELED/TIMEOUT result is passed through unchanged by giveUp (the
        // backend maps CANCELED→USER_CANCELED, TIMEOUT→EXPIRED); FAILED (→
        // PAYMENT_DECLINED) is synthesized only when requestPayment rejected
        // and there is no result object to forward.
        function buildFailedResponse(rejectErr) {
          const reason =
            (rejectErr && (rejectErr.code || rejectErr.message)) ||
            "PAYMENT_FAILED";
          return { type: "FAILED", response: { reason: String(reason) } };
        }

        // Terminal SUCCESS — shared by a live SUCCESS and a give-up that
        // discovers a real charge via getPayment. Sends session.result(SUCCESS),
        // drops pending only if the frame went out, renders the success screen.
        async function finishSuccess(result) {
          const resultSent = sendWs(ws, {
            type: "session.result",
            payload: {
              sessionId: dispatch.sessionId,
              pointUseAmount: pointUse,
              chargedSupplyValue: supplyValue,
              chargedTax: tax,
              tossResponse: result,
            },
          });
          if (resultSent) {
            await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
          }
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "수납 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
        }

        // Terminal give-up — customer tapped the back arrow on the failure
        // screen. Sends the terminal session.result so the CRM can process the
        // outcome — the original CANCELED/TIMEOUT result passed through
        // unchanged, or a synthesized FAILED for the reject path. SAFETY: a
        // REJECTED attempt may have charged on-device (bridge
        // dropped after approval), so reconcile via getPayment first — a real
        // charge is reported as SUCCESS, never overwritten with FAILED. A
        // resolved CANCELED/TIMEOUT means no charge, so skip the lookup.
        async function giveUp(result, rejectErr) {
          const rejected = !result; // reject path vs resolved non-success
          if (rejected) {
            // Reconcile ONLY the getPayment call under try/catch — a real charge
            // (bridge dropped after on-device approval) must be reported SUCCESS,
            // never overwritten with FAILED. finishSuccess() is deliberately kept
            // OUTSIDE the try: its own getMerchant/render calls must NOT unwind
            // into the FAILED path below and emit a contradictory terminal result
            // for a session we just reported SUCCESS.
            let recovered = null;
            let getPaymentInconclusive = false;
            try {
              recovered = await sdk.payment.getPayment({
                paymentKey: dispatch.sessionId,
              });
            } catch (e) {
              // PAYMENT_NOT_FOUND is the documented "nothing charged" outcome →
              // fall through to the FAILED send below. Any OTHER error (getPayment
              // unavailable/transient) is inconclusive: be conservative — send
              // FAILED but KEEP pending so home.html recovery can still reconcile
              // a late success (contract §3).
              if (!(e && e.code === "PAYMENT_NOT_FOUND")) {
                console.warn("[smartdoctor] give-up getPayment error", e);
                getPaymentInconclusive = true;
              }
            }
            if (recovered && recovered.type === "SUCCESS") {
              await finishSuccess(recovered);
              return;
            }
            if (getPaymentInconclusive) {
              sendWs(ws, {
                type: "session.result",
                payload: {
                  sessionId: dispatch.sessionId,
                  pointUseAmount: 0,
                  chargedSupplyValue: supplyValue,
                  chargedTax: tax,
                  tossResponse: buildFailedResponse(rejectErr),
                },
              });
              // KEEP pending: getPayment was inconclusive, a real charge may yet
              // surface via reconcile.
              sessionStorage.removeItem("smartdoctor.dispatch");
              sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
              closeWs(ws);
              location.href = "./home.html";
              return;
            }
          }

          const sent = sendWs(ws, {
            type: "session.result",
            payload: {
              sessionId: dispatch.sessionId,
              pointUseAmount: 0,
              chargedSupplyValue: supplyValue,
              chargedTax: tax,
              // Envelope truthing: forward the real result when we have one;
              // synthesize FAILED only for the reject path.
              tossResponse: result || buildFailedResponse(rejectErr),
            },
          });
          if (sent) {
            await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
          }
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          closeWs(ws);
          location.href = "./home.html";
        }

        // Fatal handler for the async UI callbacks in renderFailureScreen. A
        // throw inside a re-invoked attempt()/giveUp() (e.g. an SDK render/bridge
        // call rejecting) would otherwise be an unhandled rejection with no error
        // page, stranding the kiosk on a stale screen. Route it home instead.
        function fatalToHome(err) {
          console.error("[smartdoctor] payment.html retry callback fatal", err);
          location.href = "./home.html";
        }

        // Failure screen — 기획 결제 실패 화면. renderOrderResultPage(type:cancelled)
        // itemized summary; single cta 다시 결제하기 → retry (same session);
        // back arrow (onBack) → give up. Reuses the pre-Task-18 itemized layout.
        function renderFailureScreen(result, rejectErr) {
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              items: (dispatch.orderSnapshot && dispatch.orderSnapshot.items) || [],
              summary: {
                totalAmount: treatmentTotal,
                items: [
                  {
                    label: "진료 금액",
                    value: `${treatmentTotal.toLocaleString()}원`,
                    theme: "blue",
                  },
                  ...(pointUse > 0
                    ? [
                        {
                          label: "메디캐시 사용",
                          value: `-${pointUse.toLocaleString()}캐시`,
                          theme: "blue",
                        },
                      ]
                    : []),
                  {
                    label: "취소 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "결제 취소",
                    value: `${charged.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "다시 결제하기",
              // Retry on the SAME session — no terminal result was sent, so the
              // backend session is still IN_PROGRESS and this re-attempt is valid.
              // Re-ask 할부 on every retry (한도 초과 declines are fixed by
              // switching to installments); below the 5만원 floor there is no
              // 할부 to ask — straight back to the card UI.
              onClick: () => {
                if (charged >= INSTALLMENT_MIN_AMOUNT) {
                  renderInstallmentScreen(result, rejectErr);
                } else {
                  attempt().catch(fatalToHome);
                }
              },
            },
            // Back arrow = give up: terminalize with FAILED so the CRM can
            // process it. onBack support on renderOrderResultPage is [GAP] —
            // [MUST TEST]; if it does not fire, give-up falls back to EXPIRED.
            onBack: () => { giveUp(result, rejectErr).catch(fatalToHome); },
          });
        }

        // Chosen 할부 개월수 for this session's attempts. 0 = 일시불 (SDK
        // default). Overwritten on every selection; attemptOnce reads it.
        let installmentMonths = 0;

        // 할부 selection — 기획 2026-07-13. renderSelectPage (Template API;
        // live-docs shape 2026-07-13: title/subtitle required, choice delivered
        // via per-option onClick, onBack shown in the doc's code example —
        // [MUST TEST] that it fires on-device). Options: 일시불(0) + 2~12개월.
        // No 1개월 — 1 == 일시불 in Korean card practice and installment:1 is
        // undocumented. NOTE: payment method (CARD vs QR) is chosen on the
        // firmware overlay AFTER requestPayment, so this is asked first; the
        // subtitle scopes it to card payments. What installment:N does to a
        // BARCODE payment is undocumented — [MUST TEST].
        function renderInstallmentScreen(prevResult, prevRejectErr) {
          const monthOptions = [{ label: "일시불", months: 0 }];
          for (let m = 2; m <= 12; m++) {
            monthOptions.push({ label: m + "개월", months: m });
          }
          sdk.template.renderSelectPage({
            title: "할부 개월수를 선택해주세요",
            subtitle: "카드 결제 시 적용됩니다",
            options: monthOptions.map((opt) => ({
              title: opt.label,
              onClick: () => {
                installmentMonths = opt.months;
                attempt().catch(fatalToHome);
              },
            })),
            // Back arrow = give up (terminal session.result). session.abort is
            // invalid here — order.html already sent chargeContext, the session
            // is IN_PROGRESS (abort is pre-chargeContext only, spec §8). On a
            // first-prompt back-out no attempt has run, so synthesize a
            // USER_BACKED_OUT reject reason; after a failed attempt, pass the
            // real failure context through so the envelope stays truthful.
            onBack: () => {
              const err =
                !prevResult && !prevRejectErr
                  ? { code: "USER_BACKED_OUT" }
                  : prevRejectErr;
              giveUp(prevResult, err).catch(fatalToHome);
            },
          });
        }

        // Re-entrancy guard: a double-tap on 다시 결제하기 before the native
        // payment overlay takes over would otherwise fire two requestPayment
        // calls with the SAME paymentKey. Shared across retries; the wrapper
        // gates every invocation (initial call + cta re-invocations).
        let attemptInFlight = false;
        async function attempt() {
          if (attemptInFlight) return; // ignore concurrent / double-tap re-entry
          attemptInFlight = true;
          try {
            await attemptOnce();
          } finally {
            attemptInFlight = false;
          }
        }

        // One payment attempt on the same session.
        async function attemptOnce() {
          // Re-check backend error each attempt: a frame may have arrived while
          // the failure screen was up. Bail to the terminal error page if so.
          if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
            await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
            closeWs(ws);
            await renderBackendErrorPage(backendErrorRef.current);
            return;
          }

          let result = null;
          let rejectErr = null;
          try {
            result = await sdk.payment.requestPayment({
              paymentKey: dispatch.sessionId,
              tax,
              supplyValue,
              tip: dispatch.amount.tip ?? 0,
              installment: installmentMonths, // 0 = 일시불; set by 할부 screen
              timeoutMs: dispatch.timeoutMs ?? 60000,
              localeCode: "ko",
              excludePaymentTypes: ["CASH"], // spec §2.1 / §7: cash excluded
            });
          } catch (err) {
            rejectErr = err;
            console.error("[smartdoctor] requestPayment failed", err);
          }

          // Post-await re-check: an error frame that arrived DURING the (up to
          // 60s) requestPayment call is now in backendErrorRef.
          if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
            await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
            closeWs(ws);
            await renderBackendErrorPage(backendErrorRef.current);
            return;
          }

          if (result && result.type === "SUCCESS") {
            await finishSuccess(result);
            return;
          }

          // Non-success (reject OR CANCELED/TIMEOUT): show the failure screen.
          // No terminal send — session stays IN_PROGRESS so 다시 결제하기 is valid.
          renderFailureScreen(result, rejectErr);
        }

        // Entry: ask 할부 first when the amount can carry it (5만원 floor);
        // otherwise straight to the card UI as 일시불. The selection screen is
        // fire-and-forget — attempt() is entered from its option onClick, so
        // attemptInFlight is never held during customer think-time.
        if (charged >= INSTALLMENT_MIN_AMOUNT) {
          renderInstallmentScreen(null, null);
        } else {
          await attempt();
        }
      }

      // ── CANCEL / REFUND FLOW ────────────────────────────────────────
      // Spec §4.3 refund.result. dispatch.kind === "cancel".
      async function runCancel(ws, dispatch, backendErrorRef) {
        // 1. Pass cancelParams through as-is — backend constructed it.

        // Bail if backend rejected the session before we hit the SDK.
        // A cancel dispatch carries refundId/originalSessionId (NOT sessionId),
        // so key the error guard on the original session id.
        const cancelSessionId =
          dispatch.originalSessionId ?? dispatch.cancelParams?.paymentKey;
        if (isBackendErrorForSession(backendErrorRef, cancelSessionId)) {
          // IM-1: close ws before rendering error page so heartbeat timer
          // stops pinging a backend that already errored.
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        const result = await sdk.payment.requestPaymentCancel(
          dispatch.cancelParams,
        ).catch((err) => {
          console.error("[smartdoctor] requestPaymentCancel failed", err);
          return null;
        });

        if (!result) {
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          closeWs(ws);
          await renderBackendErrorPage({ message: "환불 처리 중 오류가 발생했어요" });
          return;
        }

        // RC-1: post-await re-check. An error frame that arrived DURING the
        // requestPaymentCancel call is now in backendErrorRef. If we don't
        // check here we'd send refund.result to a discarded session and
        // render a stale page. No PENDING_KEY to remove on the cancel path
        // (storage write only happens in runPayment).
        if (isBackendErrorForSession(backendErrorRef, cancelSessionId)) {
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        // 2. refund.result over WS. Spec §4.3.
        sendWs(ws, {
          type: "refund.result",
          payload: {
            refundId: dispatch.refundId,
            tossResponse: result,
          },
        });

        // 3. Hygiene: clear dispatch (no pointUse on the cancel branch, but
        //    defensively remove a stale leftover from a prior crashed session).
        sessionStorage.removeItem("smartdoctor.dispatch");
        sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

        // 4. Render result.
        if (result.type === "SUCCESS") {
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "환불 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the success
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
        } else {
          // Failure path: cancel-specific labels, no retry CTA — refund
          // retry is backend-driven per spec.
          const refundAmount =
            (dispatch.cancelParams?.supplyValue ?? 0) +
            (dispatch.cancelParams?.tax ?? 0);
          closeWs(ws);
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              // No order snapshot on the refund branch; show an empty list.
              items: [],
              summary: {
                totalAmount: refundAmount,
                items: [
                  {
                    label: "환불 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "환불 금액",
                    value: `${refundAmount.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "확인",
              onClick: () => { location.href = "./home.html"; },
            },
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the failure
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
          });
        }
      }

      // ── BOOT ────────────────────────────────────────────────────────
      // Reads hash + dispatch payload, opens WS, dispatches to runPayment
      // or runCancel. (The failure-path 다시 결제하기 retry runs in-page via
      // attempt() on the existing WS B — it does NOT re-run boot.)
      async function runFreshFlow() {
        // Tracks the most recent backend error frame (spec §11). Wrapped in
        // an object so runPayment/runCancel (outer-scope functions) receive a
        // live reference via their backendErrorRef parameter — a plain `let`
        // would be captured by value at call time and miss late-arriving frames.
        const backendErrorRef = { current: null };

        // 1. Hash id.
        const hashId = location.hash.slice(1);

        // 2. Dispatch payload — stashed by home.html on session.dispatch.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch) {
          location.href = "./home.html";
          return;
        }

        // 3. Device serial — backend trusts it via partner-portal registration.
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open WS B. Wait for onopen before dispatching.
        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        // Connect watchdog: the whole flow runs inside ws.onopen, so if WS B
        // never connects (BE down / bad token / DNS) onopen never fires and the
        // kiosk would sit on a blank WebView. Bail to home.html after 10s if
        // still not open (cleared in ws.onopen). Safe: requestPayment runs
        // inside onopen, so no card has been charged at this point.
        const connectWatchdog = setTimeout(() => {
          if (ws.readyState !== WebSocket.OPEN) {
            console.warn("[smartdoctor] payment.html WS B connect timeout");
            try {
              ws.close();
            } catch (e) {}
            location.href = "./home.html";
          }
        }, 10000);

        // 5. Minimal inbound handler — payment.html is mid-flow, not the
        //    dispatcher. session.abort defense-in-depth per spec §8.
        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("[smartdoctor] payment.html ws parse failed", e);
            return;
          }
          switch (msg.type) {
            case "pong":
              // Informational. Backend tracks heartbeat misses, not us.
              return;
            case "session.abort":
              // Per spec §8 backend should NOT send this once we're in
              // IN_PROGRESS — log and continue.
              console.warn(
                "[smartdoctor] payment.html unexpected session.abort",
                msg.payload,
              );
              return;
            case "error":
              backendErrorRef.current = msg.payload;
              console.warn("[smartdoctor] payment.html backend error", msg.payload);
              return;
            default:
              console.log("[smartdoctor] payment.html ws message", msg.type);
              return;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] payment.html ws error", ev);
        };

        ws.onclose = (ev) => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
          console.log(
            "[smartdoctor] payment.html ws closed",
            "code=" + ev.code,
            "reason=" + ev.reason,
          );
        };

        ws.onopen = async () => {
          clearTimeout(connectWatchdog);
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);
          // 6. Dispatch by kind + hash match.
          try {
            if ((dispatch.kind || "payment") === "payment" && dispatch.sessionId === hashId) {
              await runPayment(ws, dispatch, backendErrorRef);
            } else if (
              dispatch.kind === "cancel" &&
              dispatch.refundId === hashId
            ) {
              await runCancel(ws, dispatch, backendErrorRef);
            } else {
              sessionStorage.removeItem("smartdoctor.dispatch");
              sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
              closeWs(ws);
              location.href = "./home.html";
            }
          } catch (err) {
            console.error("[smartdoctor] payment.html onopen error", err);
            sessionStorage.removeItem("smartdoctor.dispatch");
            sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
            closeWs(ws);
            location.href = "./home.html";
          }
        };
      }

      runFreshFlow().catch((err) => {
        console.error("[smartdoctor] payment.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
