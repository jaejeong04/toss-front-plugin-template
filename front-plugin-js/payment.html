<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // payment.html — 100% 메디캐시 success-only page.
      //
      // Reached only when order.html detects charged === 0 (full medicash
      // coverage) and navigates here. This page:
      //   1. Reads dispatch + pointUse from sessionStorage (set by order.html).
      //   2. Opens WS B, sends device.register.
      //   3. Sends session.result(tossResponse: null, charged=0).
      //   4. Renders the custom 수납 완료 success screen.
      //   5. Navigates to home.html via location.href on timer / 확인 tap.
      //      NOT sdk.app.setIdle() — known blank-WebView lifecycle bug
      //      (design doc §3.2).
      //
      // Removed in this cleanup (NICE-paired finalized architecture):
      //   - runPayment non-zero-charge branch (sdk.payment.requestPayment)
      //   - runCancel / sdk.payment.requestPaymentCancel (refund out of scope)
      //   - dispatch.kind dispatch arms (kind removed from envelope, §4.3)
      //   - pendingPayment storage write / PENDING_KEY
      //   - mapTossFailureToKorean, mapPaymentMethodToKorean (card-only helpers)
      //   - retry CTA (card payment failure path)
      //   - renderBackendErrorPage (not needed; error frame goes straight to
      //     toast + home.html per frontend MD §7.6)
      //
      // spec refs: frontend MD §6.2 (100% 메디캐시 happy path), §7.6 (error
      // frame), §4.3 (session.result envelope), design doc §3.2 + §6.

      // Spec §4.1: ping every 20s to keep the socket alive.
      const HEARTBEAT_MS = 20000;

      // Send a JSON message over WS B, gated by readyState. Spec §4.3.
      function sendWs(ws, message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(message));
        }
      }

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      // ── BOOT ────────────────────────────────────────────────────────
      async function runFreshFlow() {
        // 1. Dispatch payload — stashed by order.html before navigating here.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch) {
          location.href = "./home.html";
          return;
        }

        // 2. pointUse stashed by order.html. Falsy/NaN → 0.
        const pointUse =
          Number(sessionStorage.getItem("smartdoctor.dispatch.pointUse")) || 0;

        // 3. Device serial for device.register.
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open WS B.
        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        // 5. Inbound handler — payment.html is terminal-side, not the
        //    dispatcher. Handle session.abort (BE→Plugin) and error frames.
        ws.onmessage = async (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("[smartdoctor] payment.html ws parse failed", e);
            return;
          }
          switch (msg.type) {
            case "pong":
              // Informational. Backend tracks heartbeat misses, not us.
              return;

            case "session.abort":
              // BE→Plugin session.abort: CRM aborted the session.
              // frontend MD §4.2 + design doc §4.3.
              ws.onmessage = null;
              if (heartbeatTimer != null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
              }
              await sdk.template.openToast({
                message: (msg.payload && msg.payload.reason) || "세션이 취소됐습니다.",
              });
              closeWs(ws);
              location.href = "./home.html";
              return;

            case "error":
              // Backend error frame. frontend MD §7.6, design doc §6.
              // Toast + navigate home. No retry — session is unrecoverable.
              ws.onmessage = null;
              if (heartbeatTimer != null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
              }
              await sdk.template.openToast({
                message:
                  (msg.payload && msg.payload.message) ||
                  "오류가 발생했습니다.",
              });
              closeWs(ws);
              location.href = "./home.html";
              return;

            default:
              console.log("[smartdoctor] payment.html ws message", msg.type);
              return;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] payment.html ws error", ev);
        };

        ws.onclose = (ev) => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
          console.log(
            "[smartdoctor] payment.html ws closed",
            "code=" + ev.code,
            "reason=" + ev.reason,
          );
        };

        ws.onopen = async () => {
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);

          try {
            // 6. Send session.result — 100% 메디캐시, no card charge.
            //    frontend MD §4.3, design doc §3.2.
            sendWs(ws, {
              type: "session.result",
              payload: {
                sessionId: dispatch.sessionId,
                pointUseAmount: pointUse,
                chargedSupplyValue: 0,
                chargedTax: 0,
                tossResponse: null,
              },
            });

            // 7. SessionStorage hygiene — dispatch + pointUse consumed.
            sessionStorage.removeItem("smartdoctor.dispatch");
            sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

            // 8. Render the custom 수납 완료 success screen.
            //    Uses sdk.template.renderResultPage (kept per frontend MD §3
            //    "Still used: sdk.app.getMerchant").
            const { name: hospitalName } = await sdk.app.getMerchant();
            closeWs(ws);
            sdk.template.renderResultPage({
              type: "image",
              status: "success",
              title: "수납 완료",
              description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
              timerMs: 5000,
              onTimeout: () => { location.href = "./home.html"; },
              buttons: [
                {
                  label: "확인",
                  onClick: () => { location.href = "./home.html"; },
                  closeOnClick: true,
                },
              ],
              // Back-arrow on success screen must not blank the WebView.
              // design doc §3.2: use location.href, NOT sdk.app.setIdle().
              onBack: () => { location.href = "./home.html"; },
              localeCode: "ko",
            });
          } catch (err) {
            console.error("[smartdoctor] payment.html onopen error", err);
            closeWs(ws);
            location.href = "./home.html";
          }
        };
      }

      runFreshFlow().catch((err) => {
        console.error("[smartdoctor] payment.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
