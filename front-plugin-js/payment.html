<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const ORDER = {
        items: [
          {
            label: "아메리카노",
            value: 3000,
            // imageUrl: "https://example.com/image.jpg", // Optional
            options: [
              {
                type: "option",
                label: "ICE",
                value: 0,
              },
              {
                type: "option",
                label: "샷추가",
                value: 500,
              },
              {
                type: "discount",
                label: "이벤트",
                value: 100,
              },
            ],
          },
          {
            label: "카페라떼",
            quantity: 2,
            value: 6000,
          },
        ],
        // discounts는 최대 3개 까지 렌더됩니다.
        discounts: [
          {
            label: "전체할인 10%",
            value: 940,
          },
        ],
        summary: {
          totalAmount: 15400,
          discountAmount: 1040,
          earned: {
            label: "매장 포인트 적립",
            value: 100,
            suffix: "P",
          },
        },
      };

      /**
       * 결제 결과를 서버에 업로드
       */
      const uploadPaymentResult = async (paymentKey, paymentResponse) => {
        const { value: token } = await sdk.storage.get({ key: "token" });

        const response = await fetch("https://example.com/api/payments", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            paymentKey,
            approvalNumber: paymentResponse.approvalNumber,
            timestamp: paymentResponse.timestamp,
            paymentMethod: paymentResponse.paymentMethod,
            amount: paymentResponse.amount,
            installment: paymentResponse.installment,
          }),
        });

        if (!response.ok) {
          throw new Error("결제 결과 서버 저장 실패");
        }
      };

      /**
       * 이미 결제된 건인지 확인
       */
      const isAlreadyPaid = async (paymentKey) => {
        const existingPayment =
          await sdk.payment.getPaymentByKey(paymentKey);
        return !!existingPayment;
      };

      /**
       * 결제 성공 처리
       */
      const onPaymentSuccess = async (paymentKey, paymentResponse) => {
        await uploadPaymentResult(paymentKey, paymentResponse);
        sdk.payment.resetBackupPaymentKey();
        console.log("결제 성공:", paymentResponse);
      };

      const onPaymentFailure = (failureType) => {
        sdk.payment.resetBackupPaymentKey();
        console.error("결제 실패:", failureType);
      };

      const onPaymentError = (error) => {
        sdk.payment.resetBackupPaymentKey();
        console.error("결제 오류:", error);
      };

      /**
       * 앱 시작 시 미완료 결제 복구
       * 결제 중 페이지 이탈로 응답을 받지 못한 경우를 처리합니다.
       */
      const recoverPendingPayment = async () => {
        const pendingPaymentKey = sdk.payment.getBackupPaymentKey();
        if (!pendingPaymentKey) {
          return;
        }

        const paymentResult =
          await sdk.payment.getPaymentByKey(pendingPaymentKey);
        if (paymentResult) {
          console.log(
            "미완료 결제 발견, 서버로 업로드:",
            pendingPaymentKey
          );
          await uploadPaymentResult(pendingPaymentKey, paymentResult);
        }

        sdk.payment.resetBackupPaymentKey();
      };

      /**
       * 결제 처리 메인 함수
       */
      const processPayment = async (order) => {
        const price = order.summary.totalAmount;
        const tax = Math.floor(price / 11);
        const supplyValue = price - tax;
        const paymentKey = crypto.randomUUID();

        if (await isAlreadyPaid(paymentKey)) {
          console.log("이미 결제된 paymentKey입니다:", paymentKey);
          return;
        }

        try {
          const result = await sdk.payment.requestPayment({
            paymentKey,
            tax,
            supplyValue,
            tip: 0,
            timeoutMs: 60000,
          });

          if (result.type === "SUCCESS") {
            await onPaymentSuccess(paymentKey, result.response);
          } else {
            await onPaymentFailure(result.type);
          }
        } catch (error) {
          onPaymentError(error);
          throw error;
        }
      };

      let timerId = null;
      const intervalMs = 1000;

      /**
       * 서버로부터 결제 요청을 수신 (Polling 방식)
       */
      const fetchPayment = async () => {
        const { value: token } = await sdk.storage.get({ key: "token" });

        const response = await fetch("https://example.com", {
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
        })
          .then((response) => response.json())
          .catch(() => ORDER);

        return response;
      };

      const handlePayment = async () => {
        const order = await fetchPayment();

        if (order == null) {
          return null;
        }

        clearInterval(timerId);
        renderOrderPage(order);
      };

      const renderOrderPage = (order) => {
        sdk.template.renderOrderPage({
          order,
          onClick: async () => {
            await processPayment(order);
            onIdle();
          },
          onBack: () => {
            onIdle();
          },
        });
      };

      const onIdle = () => {
        sdk.template.renderIdlePage();
        clearInterval(timerId);
        timerId = setInterval(handlePayment, intervalMs);
      };

      (async () => {
        await recoverPendingPayment();
        onIdle();
      })();
    </script>
  </body>
</html>
