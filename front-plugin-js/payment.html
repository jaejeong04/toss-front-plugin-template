<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <style>
      /* ── 수납 완료 success screen ─────────────────────────── */
      .success-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        background: #fff;
        padding: 0 24px 32px;
      }

      .success-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }

      .success-icon-wrap {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #EBF3FE;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .success-title {
        font-size: 24px;
        font-weight: 700;
        color: #191F28;
        margin: 0;
      }

      .success-desc {
        font-size: 15px;
        color: #8B95A1;
        margin: 0;
        white-space: pre-line;
        line-height: 1.6;
      }

      .success-amount-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 12px 0;
        border-top: 1px solid #F2F4F6;
      }

      .success-amount-label {
        font-size: 15px;
        color: #4E5968;
      }

      .success-amount-value {
        font-size: 15px;
        font-weight: 600;
        color: #3182F6;
      }

      .success-timer {
        font-size: 13px;
        color: #B0B8C1;
        margin: 0;
      }

      .success-confirm-btn {
        width: 100%;
        height: 52px;
        border-radius: 12px;
        background: #3182F6;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        margin-top: 8px;
      }
    </style>
    <script>
      // payment.html — 100% 메디캐시 success-only page.
      //
      // Reached only when order.html detects charged === 0 (full medicash
      // coverage) and navigates here. This page:
      //   1. Reads dispatch + pointUse from sessionStorage (set by order.html).
      //   2. Opens WS B, sends device.register.
      //   3. Sends session.result(tossResponse: null, charged=0).
      //   4. Renders the custom 수납 완료 success screen.
      //   5. Navigates to home.html via location.href on timer / 확인 tap.
      //      NOT sdk.app.setIdle() — known blank-WebView lifecycle bug
      //      (design doc §3.2).
      //
      // Removed in this cleanup (NICE-paired finalized architecture):
      //   - runPayment non-zero-charge branch (sdk.payment.requestPayment)
      //   - runCancel / sdk.payment.requestPaymentCancel (refund out of scope)
      //   - dispatch.kind dispatch arms (kind removed from envelope, §4.3)
      //   - pendingPayment storage write / PENDING_KEY
      //   - mapTossFailureToKorean, mapPaymentMethodToKorean (card-only helpers)
      //   - retry CTA (card payment failure path)
      //   - renderBackendErrorPage (not needed; error frame goes straight to
      //     toast + home.html per frontend MD §7.6)
      //
      // spec refs: frontend MD §6.2 (100% 메디캐시 happy path), §7.6 (error
      // frame), §4.3 (session.result envelope), design doc §3.2 + §6.

      // Spec §4.1: ping every 20s to keep the socket alive.
      const HEARTBEAT_MS = 20000;

      // Send a JSON message over WS B, gated by readyState. Spec §4.3.
      function sendWs(ws, message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(message));
        }
      }

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      // Escape user-controlled strings before injecting into innerHTML.
      function escHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ── CUSTOM SUCCESS SCREEN ────────────────────────────────────────
      // Renders the 수납 완료 success screen using custom HTML.
      // spec §3 "Explicitly NOT used": sdk.template.renderResultPage is NOT used.
      // spec §6.2: plugin renders custom 수납 완료 success screen.
      // Auto-redirects to home.html after 5 seconds (matching prior timerMs:5000).
      function renderMedicashSuccessPage(hospitalName, pointUse) {
        const SUCCESS_TIMER_MS = 5000;

        // Declare before innerHTML so the click handler shares the same binding.
        let countdown = null;

        document.getElementById("app").innerHTML = `
          <div class="success-page">
            <div class="success-body">
              <div class="success-icon-wrap">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                  <circle cx="18" cy="18" r="18" fill="#3182F6"/>
                  <path d="M10 18.5l5.5 5.5 10.5-11"
                        stroke="#fff" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <h1 class="success-title">수납 완료</h1>
              <p class="success-desc">${escHtml(hospitalName)}에\n방문해주셔서 감사합니다</p>
              <div class="success-amount-row">
                <span class="success-amount-label">메디캐시 사용</span>
                <span class="success-amount-value">${Number(pointUse).toLocaleString()}캐시</span>
              </div>
            </div>
            <p class="success-timer" id="successTimer">${SUCCESS_TIMER_MS / 1000}초 후 자동으로 이동합니다</p>
            <button class="success-confirm-btn" id="successConfirm">확인</button>
          </div>
        `;

        document.getElementById("successConfirm").addEventListener("click", () => {
          if (countdown != null) {
            clearInterval(countdown);
            countdown = null;
          }
          location.href = "./home.html";
        });

        let remaining = SUCCESS_TIMER_MS / 1000;
        const timerEl = document.getElementById("successTimer");
        countdown = setInterval(() => {
          remaining -= 1;
          if (timerEl) {
            timerEl.textContent = `${remaining}초 후 자동으로 이동합니다`;
          }
          if (remaining <= 0) {
            clearInterval(countdown);
            countdown = null;
            location.href = "./home.html";
          }
        }, 1000);
      }

      // ── BOOT ────────────────────────────────────────────────────────
      async function runFreshFlow() {
        // 1. Dispatch payload — stashed by order.html before navigating here.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch) {
          location.href = "./home.html";
          return;
        }

        // 2. pointUse stashed by order.html. Falsy/NaN → 0.
        const pointUse =
          Number(sessionStorage.getItem("smartdoctor.dispatch.pointUse")) || 0;

        // 3. Device serial for device.register.
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open WS B.
        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        // 5. Inbound handler — payment.html is terminal-side, not the
        //    dispatcher. Handle session.abort (BE→Plugin) and error frames.
        ws.onmessage = async (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("[smartdoctor] payment.html ws parse failed", e);
            return;
          }
          switch (msg.type) {
            case "pong":
              // Informational. Backend tracks heartbeat misses, not us.
              return;

            case "session.abort":
              // BE→Plugin session.abort: CRM aborted the session.
              // frontend MD §4.2 + design doc §4.3.
              ws.onmessage = null;
              if (heartbeatTimer != null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
              }
              await sdk.template.openToast({
                message: (msg.payload && msg.payload.reason) || "세션이 취소됐습니다.",
              });
              closeWs(ws);
              location.href = "./home.html";
              return;

            case "error":
              // Backend error frame. frontend MD §7.6, design doc §6.
              // Toast + navigate home. No retry — session is unrecoverable.
              ws.onmessage = null;
              if (heartbeatTimer != null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
              }
              await sdk.template.openToast({
                message:
                  (msg.payload && msg.payload.message) ||
                  "오류가 발생했습니다.",
              });
              closeWs(ws);
              location.href = "./home.html";
              return;

            default:
              console.log("[smartdoctor] payment.html ws message", msg.type);
              return;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] payment.html ws error", ev);
        };

        ws.onclose = (ev) => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
          console.log(
            "[smartdoctor] payment.html ws closed",
            "code=" + ev.code,
            "reason=" + ev.reason,
          );
        };

        ws.onopen = async () => {
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);

          try {
            // 6. Send session.result — 100% 메디캐시, no card charge.
            //    frontend MD §4.3, design doc §3.2.
            sendWs(ws, {
              type: "session.result",
              payload: {
                sessionId: dispatch.sessionId,
                pointUseAmount: pointUse,
                chargedSupplyValue: 0,
                chargedTax: 0,
                tossResponse: null,
              },
            });

            // 7. SessionStorage hygiene — dispatch + pointUse consumed.
            sessionStorage.removeItem("smartdoctor.dispatch");
            sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

            // 8. Render the custom 수납 완료 success screen.
            //    spec §3 "Explicitly NOT used": sdk.template.renderResultPage
            //    is NOT used — custom HTML for 100% 메디캐시 (frontend MD §6.2).
            //    sdk.app.getMerchant() is still used here (§3 "Still used").
            const { name: hospitalName } = await sdk.app.getMerchant();
            closeWs(ws);
            renderMedicashSuccessPage(hospitalName, pointUse);
          } catch (err) {
            console.error("[smartdoctor] payment.html onopen error", err);
            closeWs(ws);
            location.href = "./home.html";
          }
        };
      }

      runFreshFlow().catch((err) => {
        console.error("[smartdoctor] payment.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
