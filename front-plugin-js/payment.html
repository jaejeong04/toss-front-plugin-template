<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>Payment Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // payment.html — terminal page for two flows dispatched by home.html
      // (spec §6.2 doPayment, §4.2/§4.3 cancel/refund). Reads the dispatch
      // payload stashed in sessionStorage, opens its own WS B, then either
      // calls sdk.payment.requestPayment (payment) or
      // sdk.payment.requestPaymentCancel (refund) and reports the result.
      //
      // No pending-payment recovery on this page — recovery runs on home.html
      // (spec §5). Skipping it here avoids a race where a stale recovery
      // overwrites the new pending-payment storage we're about to write.

      // Spec §4.1: client sends ping every 20s; backend drops after 3 misses.
      // The user can sit on the Toss native payment UI for up to timeoutMs
      // (default 60s), so we ping to keep the socket alive during that window.
      const HEARTBEAT_MS = 20000;

      // Helper: spec §6.2 mapTossFailureToKorean.
      function mapTossFailureToKorean(result) {
        if (result.type === "TIMEOUT") return "시간 초과";
        if (result.type === "CANCELED") return "승인 거절";
        // TODO(verify-error-shape): Toss failure-code → Korean mapping is
        // GAP per spec §6.2 — extend after real-device verification.
        return "통신 오류";
      }

      // Helper: spec §6.2 mapPaymentMethodToKorean.
      function mapPaymentMethodToKorean(result) {
        const m = result.response && result.response.paymentMethod;
        if (m === "CARD") return "카드";
        if (m === "BARCODE") return "QR/바코드";
        if (m === "CASH") return "현금";
        return "—";
      }

      // Send a JSON message over WS B, gated by readyState. Spec §4.3.
      function sendWs(ws, message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(message));
        }
      }

      function closeWs(ws) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
      }

      // N-1: Guard condition helper — avoids repeating the compound check
      // at every guard site. ref.current is set by the WS onmessage handler.
      // A missing sessionId on the payload means "global error, always matches".
      function isBackendErrorForSession(ref, sessionId) {
        return ref.current && (ref.current.sessionId === sessionId || !ref.current.sessionId);
      }

      // Renders a terminal error page using a backend error payload.
      // Both timer and button route to home.html. No custom HTML — uses
      // sdk.template.renderResultPage exclusively. Per spec §11.
      async function renderBackendErrorPage(payload) {
        const reason = (payload && (payload.message || payload.code)) || "알 수 없는 오류";
        const description = `${reason}\n잠시 후 다시 시도해 주세요`;
        await sdk.template.renderResultPage({
          type: "image",
          status: "error",
          title: "결제를 진행할 수 없어요",
          description,
          timerMs: 5000,
          onTimeout: () => { location.href = "./home.html"; },
          buttons: [
            {
              label: "확인",
              onClick: () => { location.href = "./home.html"; },
              closeOnClick: true,
            },
          ],
          // N-2: match every other terminal renderResultPage call in this
          // file — localeCode and onBack prevent a blank WebView on back-tap.
          onBack: () => { location.href = "./home.html"; },
          localeCode: "ko",
        });
      }

      // ── PAYMENT FLOW ────────────────────────────────────────────────
      // Spec §6.2. dispatch.kind === "payment".
      async function runPayment(ws, dispatch, backendErrorRef) {
        // 1. pointUse from order.html. Falsy/NaN → 0.
        const pointUse =
          Number(sessionStorage.getItem("smartdoctor.dispatch.pointUse")) || 0;

        // 2. Charged amounts. Spec §6.2: tax = floor(charged / 11),
        //    supplyValue = charged − tax. NOT charged * 0.1, NOT round.
        const treatmentTotal =
          dispatch.amount.supplyValue + dispatch.amount.tax;
        const charged = treatmentTotal - pointUse;
        const tax = Math.floor(charged / 11);
        const supplyValue = charged - tax;

        // 3. 100% 메디캐시 coverage — no Toss-side payment to make.
        //     Toss docs only document non-zero requestPayment examples and don't
        //     specify behavior at tax=0/supplyValue=0, so we skip the SDK call
        //     entirely. Backend contract: when chargedSupplyValue === 0 AND
        //     chargedTax === 0 AND tossResponse === null, treat as a points-only
        //     payment (no card/cash transaction occurred).
        if (charged === 0) {
          // IM-2: guard between chargeContext and session.result. If backend
          // rejected the chargeContext we must not send session.result to a
          // discarded session and must not render a false success. Synchronous
          // JS between the two sendWs calls means no microtask ran between
          // them, but error frames queued before chargeContext may already be
          // in backendErrorRef. Explicit check makes behavior consistent with
          // all other paths.
          if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
            closeWs(ws);
            await renderBackendErrorPage(backendErrorRef.current);
            return;
          }
          sendWs(ws, {
            type: "session.result",
            payload: {
              sessionId: dispatch.sessionId,
              pointUseAmount: pointUse,
              chargedSupplyValue: 0,
              chargedTax: 0,
              tossResponse: null,
            },
          });
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "수납 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the success
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
          return;
        }

        // 4. Persist pendingPayment BEFORE requestPayment. paymentKey ===
        //    sessionId per spec §4.2. Used by home.html's recovery helper
        //    if this page crashes.
        await sdk.storage.set({
          key: window.smartdoctor.PENDING_KEY,
          value: JSON.stringify({
            sessionId: dispatch.sessionId,
            paymentKey: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
          }),
        });

        // 5. Request payment. Spec §2.1 / §7: cash excluded literally.

        // Bail if backend rejected our chargeContext or otherwise rejected the
        // session — error frame arrived between chargeContext send and this point.
        // Without this guard the real card would be charged on a session backend
        // has already discarded. Real-money critical. Per spec §11 (toss-payment-flow.md).
        if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
          // IM-1: close ws before rendering error page so heartbeat timer
          // stops pinging a backend that already errored.
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        const result = await sdk.payment.requestPayment({
          paymentKey: dispatch.sessionId,
          tax,
          supplyValue,
          tip: dispatch.amount.tip,
          timeoutMs: dispatch.timeoutMs ?? 60000,
          localeCode: "ko",
          excludePaymentTypes: ["CASH"],
        }).catch((err) => {
          console.error("[smartdoctor] requestPayment failed", err);
          return null;
        });

        if (!result) {
          await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          closeWs(ws);
          await renderBackendErrorPage({ message: "결제 처리 중 오류가 발생했어요" });
          return;
        }

        // RC-1: post-await re-check. An error frame that arrived DURING the
        // requestPayment call (user held the terminal for minutes) is now in
        // backendErrorRef. If we don't check here we'd send session.result to
        // a session backend has already discarded and render a stale page.
        // Clean up pending storage first so recovery on home.html doesn't
        // re-attempt a session that's already gone.
        if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
          await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        // 6. Remove pendingPayment AFTER requestPayment resolves — we now
        //    have the live result and can post it directly.
        await sdk.storage.remove({ key: window.smartdoctor.PENDING_KEY });

        // 7. session.result on the live path (no `late: true`). Spec §4.3.
        sendWs(ws, {
          type: "session.result",
          payload: {
            sessionId: dispatch.sessionId,
            pointUseAmount: pointUse,
            chargedSupplyValue: supplyValue,
            chargedTax: tax,
            tossResponse: result,
          },
        });

        // 8. sessionStorage hygiene — dispatch + pointUse have been consumed.
        sessionStorage.removeItem("smartdoctor.dispatch");
        sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

        // 9. Render terminal screen.
        if (result.type === "SUCCESS") {
          // Spec §6.2 / PDF p.13: renderResultPage with image+success.
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "수납 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the success
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
        } else {
          // Spec §6.2 / PDF p.12: renderOrderResultPage cancelled.
          // Retry button re-enters runPayment with the same dispatch +
          // (closure) pointUse — re-enters spec §6.2 p.11.
          closeWs(ws);
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              items: dispatch.orderSnapshot.items,
              summary: {
                totalAmount: treatmentTotal,
                items: [
                  {
                    label: "진료 금액",
                    value: `${treatmentTotal.toLocaleString()}원`,
                    theme: "blue",
                  },
                  ...(pointUse > 0
                    ? [
                        {
                          label: "메디캐시 사용",
                          value: `-${pointUse.toLocaleString()}캐시`,
                          theme: "blue",
                        },
                      ]
                    : []),
                  {
                    label: "취소 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "결제 취소",
                    value: `${charged.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "확인",
              // No retry CTA: backend already terminalized this session
              // when we sent session.result above. Re-trying would re-send
              // chargeContext for a session backend has discarded. CRM
              // must initiate a new session.create for retries (one
              // session = one payment attempt per spec). Navigate back to
              // home.html which re-mounts the dispatcher.
              onClick: () => {
                location.href = "./home.html";
              },
            },
            // Back-arrow on this failure/timeout page was the original
            // device-bricking bug — SDK dismisses its overlay leaving
            // a blank WebView. Session is already terminal (CANCELED/
            // TIMEOUT recorded by backend); just escape to OS idle.
            onBack: () => { location.href = "./home.html"; },
          });
        }
      }

      // ── CANCEL / REFUND FLOW ────────────────────────────────────────
      // Spec §4.3 refund.result. dispatch.kind === "cancel".
      async function runCancel(ws, dispatch, backendErrorRef) {
        // 1. Pass cancelParams through as-is — backend constructed it.

        // Bail if backend rejected the session before we hit the SDK.
        // Refund doesn't carry the same real-money charge risk (it's a
        // reverse), but spec §11 compliance + consistent error surfacing.
        if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
          // IM-1: close ws before rendering error page so heartbeat timer
          // stops pinging a backend that already errored.
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        const result = await sdk.payment.requestPaymentCancel(
          dispatch.cancelParams,
        ).catch((err) => {
          console.error("[smartdoctor] requestPaymentCancel failed", err);
          return null;
        });

        if (!result) {
          sessionStorage.removeItem("smartdoctor.dispatch");
          sessionStorage.removeItem("smartdoctor.dispatch.pointUse");
          closeWs(ws);
          await renderBackendErrorPage({ message: "환불 처리 중 오류가 발생했어요" });
          return;
        }

        // RC-1: post-await re-check. An error frame that arrived DURING the
        // requestPaymentCancel call is now in backendErrorRef. If we don't
        // check here we'd send refund.result to a discarded session and
        // render a stale page. No PENDING_KEY to remove on the cancel path
        // (storage write only happens in runPayment).
        if (isBackendErrorForSession(backendErrorRef, dispatch.sessionId)) {
          closeWs(ws);
          await renderBackendErrorPage(backendErrorRef.current);
          return;
        }

        // 2. refund.result over WS. Spec §4.3.
        sendWs(ws, {
          type: "refund.result",
          payload: {
            refundId: dispatch.refundId,
            tossResponse: result,
          },
        });

        // 3. Hygiene: clear dispatch (no pointUse on the cancel branch, but
        //    defensively remove a stale leftover from a prior crashed session).
        sessionStorage.removeItem("smartdoctor.dispatch");
        sessionStorage.removeItem("smartdoctor.dispatch.pointUse");

        // 4. Render result.
        if (result.type === "SUCCESS") {
          const { name: hospitalName } = await sdk.app.getMerchant();
          closeWs(ws);
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "환불 완료",
            description: `${hospitalName}에\n 방문해주셔서 감사합니다`,
            timerMs: 5000,
            onTimeout: () => { location.href = "./home.html"; },
            buttons: [
              {
                label: "확인",
                onClick: () => { location.href = "./home.html"; },
                closeOnClick: true,
              },
            ],
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the success
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
            localeCode: "ko",
          });
        } else {
          // Failure path: cancel-specific labels, no retry CTA — refund
          // retry is backend-driven per spec.
          const refundAmount =
            (dispatch.cancelParams?.supplyValue ?? 0) +
            (dispatch.cancelParams?.tax ?? 0);
          closeWs(ws);
          sdk.template.renderOrderResultPage({
            type: "cancelled",
            order: {
              // No order snapshot on the refund branch; show an empty list.
              items: [],
              summary: {
                totalAmount: refundAmount,
                items: [
                  {
                    label: "환불 사유",
                    value: mapTossFailureToKorean(result),
                    theme: "red",
                  },
                  {
                    label: "결제 수단",
                    value: mapPaymentMethodToKorean(result),
                    theme: "blue",
                  },
                  {
                    label: "환불 금액",
                    value: `${refundAmount.toLocaleString()}원`,
                    theme: "red",
                  },
                ],
              },
            },
            cta: {
              text: "확인",
              onClick: () => { location.href = "./home.html"; },
            },
            // Session terminal at this point — back-arrow just escapes
            // to OS idle. Without this, a back-tap on the failure
            // screen blanks the WebView (see also: timeout/cancel page
            // bug fix in this commit). All terminal renders get the
            // same onBack.
            onBack: () => { location.href = "./home.html"; },
          });
        }
      }

      // ── BOOT ────────────────────────────────────────────────────────
      // Reads hash + dispatch payload, opens WS, dispatches to runPayment
      // or runCancel. The `runFreshFlow` indirection lets the failure-path
      // retry button re-run boot for a fresh WS.
      async function runFreshFlow() {
        // Tracks the most recent backend error frame (spec §11). Wrapped in
        // an object so runPayment/runCancel (outer-scope functions) receive a
        // live reference via their backendErrorRef parameter — a plain `let`
        // would be captured by value at call time and miss late-arriving frames.
        const backendErrorRef = { current: null };

        // 1. Hash id.
        const hashId = location.hash.slice(1);

        // 2. Dispatch payload — stashed by home.html on session.dispatch.
        const dispatchJson = sessionStorage.getItem("smartdoctor.dispatch");
        const dispatch = dispatchJson ? JSON.parse(dispatchJson) : null;
        if (!dispatch) {
          location.href = "./home.html";
          return;
        }

        // 3. Device serial — backend trusts it via partner-portal registration.
        const { serialNumber } = await sdk.app.getSerialNumber();

        // 4. Open WS B. Wait for onopen before dispatching.
        const ws = new WebSocket(window.smartdoctor.pluginWsUrl(serialNumber));
        let heartbeatTimer = null;

        // 5. Minimal inbound handler — payment.html is mid-flow, not the
        //    dispatcher. session.abort defense-in-depth per spec §8.
        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("[smartdoctor] payment.html ws parse failed", e);
            return;
          }
          switch (msg.type) {
            case "pong":
              // Informational. Backend tracks heartbeat misses, not us.
              return;
            case "session.abort":
              // Per spec §8 backend should NOT send this once we're in
              // IN_PROGRESS — log and continue.
              console.warn(
                "[smartdoctor] payment.html unexpected session.abort",
                msg.payload,
              );
              return;
            case "error":
              backendErrorRef.current = msg.payload;
              console.warn("[smartdoctor] payment.html backend error", msg.payload);
              return;
            default:
              console.log("[smartdoctor] payment.html ws message", msg.type);
              return;
          }
        };

        ws.onerror = (ev) => {
          console.warn("[smartdoctor] payment.html ws error", ev);
        };

        ws.onclose = (ev) => {
          if (heartbeatTimer != null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
          console.log(
            "[smartdoctor] payment.html ws closed",
            "code=" + ev.code,
            "reason=" + ev.reason,
          );
        };

        ws.onopen = async () => {
          // spec §4.3: first message after connect
          ws.send(
            JSON.stringify({
              type: "device.register",
              payload: { serialNumber, sdkVersion: "v0" },
            }),
          );
          heartbeatTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "ping", payload: {} }));
            }
          }, HEARTBEAT_MS);
          // 6. Dispatch by kind + hash match.
          try {
            if (dispatch.kind === "payment" && dispatch.sessionId === hashId) {
              await runPayment(ws, dispatch, backendErrorRef);
            } else if (
              dispatch.kind === "cancel" &&
              dispatch.refundId === hashId
            ) {
              await runCancel(ws, dispatch, backendErrorRef);
            } else {
              closeWs(ws);
              location.href = "./home.html";
            }
          } catch (err) {
            console.error("[smartdoctor] payment.html onopen error", err);
            closeWs(ws);
            location.href = "./home.html";
          }
        };
      }

      runFreshFlow().catch((err) => {
        console.error("[smartdoctor] payment.html fatal", err);
        location.href = "./home.html";
      });
    </script>
  </body>
</html>
