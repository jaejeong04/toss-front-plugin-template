<!DOCTYPE html>
<html lang="ko">
<head>
  
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./config.js"></script>
    <title>플러그인 설정 (예시)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 24px;
        color: #1a1a1a;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .setting-label {
        font-size: 15px;
        color: #333;
      }
      .setting-value {
        font-size: 15px;
        color: #666;
      }
      select {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
        cursor: pointer;
      }
      .toggle {
        position: relative;
        width: 52px;
        height: 32px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.3s;
        border-radius: 32px;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
      }
      .toggle input:checked + .toggle-slider {
        background-color: #0064ff;
      }
      .toggle input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }
    </style>
</head>
<body>
  <div class="container">
    <h1>플러그인 설정 (예시)</h1>

    <!-- Toss SN -->
    <div class="setting-row">
      <span class="setting-label">Toss SN</span>
      <span class="setting-value" id="serial-number">-</span>
    </div>

    <!-- 시리얼 통신 속도 -->
    <div class="setting-row">
      <span class="setting-label">시리얼 통신 속도</span>
      <select id="baud-rate">
        <option value="115200">115200</option>
        <option value="38400">38400</option>
      </select>
    </div>

    <!-- 대기 화면에 매장명 표시 -->
    <div class="setting-row">
      <span class="setting-label">대기 화면에 매장명 표시</span>
      <label class="toggle">
        <input type="checkbox" id="show-store-name">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      BAUD_RATE: 'settings_baud_rate',
      SHOW_STORE_NAME: 'settings_show_store_name',
    };

    // 초기 설정값 로드
    async function loadSettings() {
      try {
        // Toss SN 가져오기
      const { serialNumber } = await sdk.app.getSerialNumber();
        document.getElementById('serial-number').textContent = serialNumber;
      } catch (e) {
        document.getElementById('serial-number').textContent = '알 수 없음';
      }

      try {
        // 시리얼 통신 속도 불러오기
        const { value: baudRate } = await sdk.storage.get({ key: STORAGE_KEYS.BAUD_RATE });
        if (baudRate) {
          document.getElementById('baud-rate').value = baudRate;
        }

        // 대기 화면 매장명 표시 설정 불러오기
        const { value: showStoreNameValue } = await sdk.storage.get({ key: STORAGE_KEYS.SHOW_STORE_NAME });
        // 저장된 값이 없으면 기본값 true
        const showStoreName = showStoreNameValue == null ? true : showStoreNameValue === 'true';
        document.getElementById('show-store-name').checked = showStoreName;
      } catch (e) {
        console.error('설정 불러오기 실패:', e);
      }
    }

    // 시리얼 통신 속도 변경 시 저장
    document.getElementById('baud-rate').addEventListener('change', async (e) => {
      const baudRate = e.target.value;
      try {
        await sdk.storage.set({
          key: STORAGE_KEYS.BAUD_RATE,
          value: baudRate,
        });
        console.log('통신 속도 저장 완료:', baudRate);
      } catch (e) {
        console.error('통신 속도 저장 실패:', e);
      }
    });

    // 대기 화면 매장명 표시 토글 변경 시 저장
    document.getElementById('show-store-name').addEventListener('change', async (e) => {
      const showStoreName = e.target.checked;
      try {
        await sdk.storage.set({
          key: STORAGE_KEYS.SHOW_STORE_NAME,
          value: String(showStoreName),
        });
        console.log('매장명 표시 설정 저장 완료:', showStoreName ? '표시' : '표시하지 않음');
      } catch (e) {
        console.error('매장명 표시 설정 저장 실패:', e);
      }
    });

    // 페이지 로드 시 설정 불러오기
    loadSettings();
  </script>
</body>
</html>
